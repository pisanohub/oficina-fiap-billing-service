services:
  billing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: billing_local
      POSTGRES_PASSWORD: billing_local
    ports:
      - "127.0.0.1:5543:5432"
    volumes:
      - billing-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_local -d billing_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  billing-local-data:
