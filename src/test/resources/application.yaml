spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Padrões offline; os testes de webhook sobrescrevem a habilitação explicitamente.
mercadopago:
  enabled: false
  access-token: ""
  webhook:
    enabled: false
