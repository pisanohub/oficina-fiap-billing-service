spring:
  application:
    name: billing-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  timeout: 10s
  webhook:
    enabled: ${MERCADOPAGO_WEBHOOK_ENABLED:false}
    secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    tolerance: ${MERCADOPAGO_WEBHOOK_TOLERANCE:5m}
